<div class="grid grid-cols-2 gap-1 my-4 lg:grid-cols-4 lg:gap-4">
    @for (card of cards; track card.title) {
        <div class="bg-white shadow-md rounded-lg p-2">
            <svg  lucideListTodo class="h-10 w-10 text-3xl text-white p-2 rounded-full bg-blue-400  mb-2"></svg>
            <p class="font-medium text-2xl">{{ card.value() }}</p>
            <h3 class="text-gray-400 text-sm">{{ card.title }}</h3>
        </div>
    }
</div>
